<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizVerse</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body>


    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            🧩
        </div>

        <span>
            QuizVerse
        </span>

    </div>


    <!-- MAIN CONTENT -->

    <main class="welcome-content">


        <div class="quiz-icon">
            <img src="https://media.istockphoto.com/id/2179659565/vector/faq-question-icon-vector-elements-isolated-on-white.jpg?s=612x612&w=0&k=20&c=wemxQbmYsmf3UDJR5VLu7osFKK4wAJEKpKh2d4FTJZI=" alt="Quiz Icon" width="100" height="100">
        </div>


        <h1>

            Play Smart Quiz<br>

            Every Day

        </h1>


        <p>

            Boost knowledge daily, win challenges,<br>

            become smarter every day.

        </p>


        <!-- SLIDE BUTTON -->

        <div class="slide-container">

            <div class="slide-button" id="slide-button">


                <div class="slide-circle">

                    →

                </div>


                <span>

                    Get Started

                </span>


            </div>

        </div>


        <small>

            Slide to get started

        </small>


    </main>


    <script src="script1.js"></script>

</body>

</html>
