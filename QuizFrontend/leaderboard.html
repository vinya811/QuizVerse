<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Leaderboard | QuizVerse</title>

    <link rel="stylesheet" href="leaderboard.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🧩 QuizVerse
        </div>

        <button id="back-btn">
            ← Back
        </button>

    </header>


    <!-- MAIN -->

    <main>

        <section class="leaderboard-container">

            <div class="leaderboard-title">

                <div class="trophy">
                    🏆
                </div>

                <h1>
                    QuizVerse Leaderboard
                </h1>

                <p>
                    See who's leading the quiz challenge!
                </p>

            </div>


            <!-- TOP THREE -->

            <div id="top-three">

            </div>


            <!-- LEADERBOARD -->

            <div class="leaderboard-list">

                <div class="list-header">

                    <span>
                        Rank
                    </span>

                    <span>
                        Player
                    </span>

                    <span>
                        Points
                    </span>

                </div>


                <div id="leaderboard-list">

                    <p class="loading">
                        Loading leaderboard...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="leaderboard.js"></script>

</body>

</html>
