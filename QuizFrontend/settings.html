<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings - QuizVerse</title>

    <link rel="stylesheet" href="settings.css">

</head>

<body>

    <div class="settings-container">


        <button id="back-btn">

            ← Back

        </button>

       <!-- <button id="back-btn" class="back-btn">
    ← Back 
</button>-->


        <h1>⚙ Settings</h1>


        <!-- USERNAME -->

        <div class="setting-box">

            <h3>Username</h3>

            <input

                type="text"

                id="username-input"

                placeholder="Enter username"

            >

        </div>


        <!-- PHONE NUMBER -->

        <div class="setting-box">

            <h3>Phone Number</h3>

            <input

                type="text"

                id="phone-input"

                placeholder="Enter phone number"

            >

        </div>


        <!-- DARK MODE -->

        <div class="setting-box">

            <h3>Theme</h3>

            <button id="theme-btn">

                🌙 Dark Mode

            </button>

        </div>


        <!-- SAVE BUTTON -->

        <button id="save-btn">

            Save Changes

        </button>

        <button id="delete-btn" class="delete-btn">
    🗑️ Delete My Account
</button>


        <p id="message"></p>


    </div>


    <script src="settings.js"></script>

</body>

</html>
