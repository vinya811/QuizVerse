<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - QuizVerse</title>

    <link rel="stylesheet" href="style3.css">

</head>

<body>


    <div class="signup-card">


        <button id="back-btn" class="back-btn">

            ← Back

        </button>


        <h1>

            Create Account

        </h1>


        <p>

            Join QuizVerse and start your quiz journey

        </p>


        <!-- EMAIL -->

        <input

            type="email"

            id="email"

            placeholder="Enter your email"

        >


        <!-- USERNAME -->

        <input

            type="text"

            id="username"

            placeholder="Enter your username"

        >


        <!-- PASSWORD -->

        <input

            type="password"

            id="password"

            placeholder="Create a password"

        >


        <!-- PHONE NUMBER -->

        <input

            type="tel"

            id="phone"

            placeholder="Enter your phone number"

        >


        <!-- DATE OF BIRTH -->

        <label>

            Date of Birth

        </label>


        <input

            type="date"

            id="dob"

        >


        <!-- ERROR MESSAGE -->

        <p id="error-message"></p>


        <!-- REGISTER BUTTON -->

        <button

            id="register-btn"

            class="register-btn"

        >

            Register

        </button>


    </div>


    <script src="script3.js"></script>

</body>

</html>
