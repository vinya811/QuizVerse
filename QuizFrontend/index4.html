<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizVerse Home</title>

    <link rel="stylesheet" href="style4.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            🧩 QuizVerse
        </div>

        <div class="profile" id="profile">

            👤 <span id="username">User</span>

            <div class="profile-menu" id="profile-menu">

                <button id="settings-btn">
                    ⚙ Settings
                </button>

                <button id="logout-btn">
                    🚪 Logout
                </button>

            </div>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- HERO -->

        <section class="hero">

            <h1>
                Welcome to QuizVerse! 🎯
            </h1>

            <p>
                Test your knowledge, challenge yourself,
                and become smarter every day.
            </p>

        </section>


        <!-- QUIZ SECTION -->

        <section class="quiz-section">

            <div class="section-heading">

                <h2>
                    Choose Your Quiz
                </h2>

                <span id="quiz-count">
                    0 Quizzes
                </span>

            </div>


            <div id="quiz-list">

                <!-- JAVASCRIPT QUIZ -->

                <div class="quiz-card">

                    <h3>
                        💻 JavaScript
                    </h3>

                    <p>
                        Test your JavaScript knowledge
                        from basics to advanced concepts.
                    </p>

                    <button
                        onclick="startQuiz('javascript')"
                    >
                        Start Quiz →
                    </button>

                </div>


                <!-- GENERAL KNOWLEDGE -->

                <div class="quiz-card">

                    <h3>
                        🌍 General Knowledge
                    </h3>

                    <p>
                        Challenge yourself with
                        interesting GK questions.
                    </p>

                    <button
                        onclick="startQuiz('gk')"
                    >
                        Start Quiz →
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="script4.js"></script>

</body>

</html>
