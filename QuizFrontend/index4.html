<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QuizVerse Home</title>

    <link rel="stylesheet" href="style4.css">

    <!-- GLOBAL DARK MODE -->
    <link rel="stylesheet" href="darkmode.css">

</head>

<body>


    <!-- ==============================
         HEADER
    =============================== -->

    <header>

        <div class="logo">

            🧩 QuizVerse

        </div>


        <div
            class="profile"
            id="profile"
        >

            👤

            <span id="username">

                User

            </span>


            <!-- PROFILE MENU -->

            <div
                class="profile-menu"
                id="profile-menu"
            >

                <button id="settings-btn">

                    ⚙ Settings

                </button>


                <button id="logout-btn">

                    🚪 Logout

                </button>

            </div>

        </div>

    </header>


    <!-- ==============================
         MAIN
    =============================== -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <h1>

                Play Smart.<br>

                Get Smarter. 🎯

            </h1>


            <p>

                Challenge yourself and boost your knowledge every day.

            </p>

        </section>


        <!-- ==============================
             LEADERBOARD
        =============================== -->

        <section class="leaderboard-section">

            <div class="leaderboard-card">

                <div class="leaderboard-icon">

                    🏆

                </div>


                <div class="leaderboard-content">

                    <h2>

                        QuizVerse Leaderboard

                    </h2>


                    <p>

                        See who's leading the quiz challenge!

                    </p>

                </div>


                <button id="leaderboard-btn">

                    View Leaderboard →

                </button>

            </div>

        </section>


        <!-- ==============================
             QUIZZES
        =============================== -->

        <section class="quiz-section">


            <div class="section-heading">

                <h2>

                    Available Quizzes

                </h2>


                <span id="quiz-count">

                    0 Quizzes

                </span>

            </div>


            <div id="quiz-list">

            </div>


        </section>


    </main>


    <!-- EXISTING HOME JAVASCRIPT -->

    <script src="script4.js"></script>

    <!-- GLOBAL DARK MODE -->

    <script src="darkmode.js"></script>

</body>

</html>
