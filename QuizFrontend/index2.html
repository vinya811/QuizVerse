<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Welcome Back - QuizVerse</title>

    <link rel="stylesheet" href="style2.css">

</head>


<body>

    <div class="login-card">

        <h1>
            Welcome Back!
        </h1>

        <p>
            Login to continue your quiz journey
        </p>


        <!-- EMAIL -->

        <input
            type="email"
            id="login-email"
            placeholder="Enter your email"
            autocomplete="email"
        >


        <!-- PASSWORD -->

        <input
            type="password"
            id="login-password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >


        <!-- ERROR / SUCCESS MESSAGE -->

        <p id="login-error"></p>


        <!-- LOGIN BUTTON -->

        <button
            class="login-btn"
            id="login-btn"
            type="button"
        >
            Login
        </button>


        <!-- SIGN UP -->

        <p class="signup-text">

            Don't have an account?

            <span id="signup-link">
                Sign up
            </span>

        </p>

    </div>


    <script src="script2.js"></script>

</body>

</html>
