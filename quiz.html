<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizVerse Quiz</title>

    <link rel="stylesheet" href="quiz.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            🧩 QuizVerse

        </div>

        <div class="timer">

            ⏰ <span id="timer">15:00</span>

        </div>

    </header>

    <!-- MAIN -->

    <main>

        <h1 id="subject"></h1>

<p id="difficulty"></p>


        <!-- INFO CARDS -->

        <div class="info-container">

            <div class="info-card">

                <h2 id="totalQuestions">

                    20

                </h2>

                <p>Questions</p>

            </div>

            <div class="info-card">

                <h2 id="timeLimit">

                    15 Min

                </h2>

                <p>Time</p>

            </div>

            <div class="info-card">

                <h2 id="points">

                    +5

                </h2>

                <p>Points</p>

            </div>

            <div class="info-card">

                <h2 id="progressText">

                    1 / 20

                </h2>

                <p>Progress</p>

            </div>

        </div>

        <!-- PROGRESS BAR -->

        <div class="progress">

            <div class="progress-fill" id="progressFill"></div>

        </div>

        <!-- QUESTION -->

        <div class="question-box">

            <h2 id="questionNumber">

                Question 1
            </h2>

            <h3 id="questionText">

                Loading Question...

            </h3>

            <div id="options">

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button id="previousBtn">

                ← Previous

            </button>

            <button id="nextBtn">

                Next →

            </button>

        </div>

    </main>

    <script src="quiz.js"></script>

</body>

</html>
